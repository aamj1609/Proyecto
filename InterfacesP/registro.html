<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body class="registro-cuerpo">

    <main class="registro-contenedor">
        <a href="index.html" class="registro-regresar">Regresar</a>

        <h1 class="registro-titulo">REGISTRO</h1>

        <form>
            <label class="registro-label">Nombre:</label>
            <input class="registro-input" type="text" placeholder="Escribe tu nombre">

            <label class="registro-label">Edad:</label>
            <input class="registro-input" type="number" placeholder="Escribe tu edad">

            <label class="registro-label">Correo:</label>
            <input class="registro-input" type="email" placeholder="ejemplo@correo">

            <label class="registro-label">Contraseña:</label>
            <input class="registro-input" type="password" placeholder="Coloca tu contraseña">

            <button class="registro-boton" type="submit">Guardar</button>
        </form>
    </main>

</body>
</html>
